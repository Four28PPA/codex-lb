name: Owned Image Build

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to publish"
        required: true
        default: "ownership-unmodified-20260509"
  push:
    branches:
      - ownership/unmodified-image-pipeline

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: owned-image-build-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/four28ppa/codex-lb
  IMAGE_TAG: ${{ inputs.image_tag || 'ownership-unmodified-20260509' }}

jobs:
  frontend:
    name: Frontend gates
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Set up Node for Vitest runner
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install frontend dependencies
        run: cd frontend && bun install --frozen-lockfile

      - name: Run frontend type check
        run: cd frontend && bun run typecheck

      - name: Run frontend lint
        run: cd frontend && bun run lint

      - name: Run frontend tests with Node-backed Vitest
        run: cd frontend && node ./node_modules/vitest/vitest.mjs run

      - name: Build frontend
        run: cd frontend && bun run build

  backend:
    name: Backend gates
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest

      - name: Ruff check
        run: uv run ruff check

  image:
    name: Build and publish image
    needs:
      - frontend
      - backend
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.IMAGE_TAG }}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.description=Owned Codex LB image built from forked upstream source

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7.1.0
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record image digest
        run: |
          {
            echo "## Owned image build"
            echo "- Image tag: `${IMAGE_NAME}:${IMAGE_TAG}`"
            echo "- Image digest: `${IMAGE_NAME}@${{ steps.build.outputs.digest }}`"
            echo "- Source commit: `${GITHUB_SHA}`"
            echo "- SBOM/provenance: requested via Docker Buildx"
          } >> "$GITHUB_STEP_SUMMARY"
